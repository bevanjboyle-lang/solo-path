    <!-- Brand typography: Plus Jakarta Sans (display) + Inter (body).
         Source Serif 4 is a bounded exception for long-form editorial prose on /report only —
         see admin/pass-1-report-decisions.md F5 and the project_typography_serif_exception_report memory. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Plus Jakarta Sans weights:
        600 = semibold (body H3/H4)
        700 = bold     (eyebrow + body H2)
      Weight 800 added 2026-06-10: .title-h1 is now PJS-first
      (design-direction v1.7), so the hero weight 800 must load.
      Body / eyebrow / non-hero headings still use PJS 600/700.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap"
      rel="stylesheet"
    />

    <!-- Critical CSS — panel surfaces.
         The body is intentionally transparent (see src/index.css:90); a fixed
         photo layer in App.tsx provides the page background. Tailwind's
         @layer components (where .panel-ivory / .panel-dark backgrounds
         live) loads after first paint, so without this inline block the
         photo bleeds through every panel for ~2-4 seconds on first paint
         (visual-audit-2026-05-18 "FOUC" finding, every surface). Keep this
         block minimal — just enough to make panels opaque before Tailwind
         hydrates; the full styling (shadow, border, radius) comes through
         the component layer once it loads. -->
    <style>
      .panel-ivory { background: #FAF9F7; }
      .panel-dark  { background: #1A1915; }
    </style>
