# ──────────────────────────────────────────────────────────────────────────
# verify_jwt policy — full-e2e-review-2026-06-10.
# verify_jwt:false means the gateway does NOT validate the JWT signature, so
# any function that trusts the `sub` claim from an inline base64 decode is
# forgeable. Only the genuinely anonymous funnel entry points may stay false.
# ──────────────────────────────────────────────────────────────────────────

# Anonymous funnel — MUST stay false (called before the user has an account).
[functions.generate-report]
verify_jwt = false

# Anonymous teaser preview (Move 5, 2026-08-18): serves the sanitised free
# zone + server-redacted locked preview to the pre-payment teaser. Must stay
# false; the report UUID is the capability, and nothing sensitive is returned.
[functions.get-teaser-preview]
verify_jwt = false

# Anonymous funnel — MUST stay false (Phase B, 2026-08-18). Serves the
# KB-classified diagnostic read before any account exists. Rate-limited
# per IP inside the function; falls back gracefully so the client's
# deterministic read still renders if this errors.
[functions.diagnostic-read]
verify_jwt = false

# Phase C batch job (2026-08-18): regenerates kb_archetypes.capability_vector.
# verify_jwt true (any valid JWT passes the gateway; the anon key suffices for
# pg_net invocation); in-function guard = confirm token + idempotent skip of
# archetypes that already carry a vector + per-IP rate limit. Writes only KB
# columns, reads no user data.
[functions.admin-generate-archetype-capabilities]
verify_jwt = true

# Authed-only — flipped true 2026-06-10 (was false; forgeable identity).
[functions.generate-guidance]
verify_jwt = true

[functions.ask-solo]
verify_jwt = true

[functions.draft-outreach]
verify_jwt = true

# Destructive / PII — pinned true (live-fixed via Supabase 2026-06-10, P0).
[functions.delete-account]
verify_jwt = true

[functions.export-user-data]
verify_jwt = true

[functions.delete-user-cv]
verify_jwt = true

# get-library-content: verify_jwt explicitly true. The function reads a user-
# specific library (subscription state, completions, unlocked modules) and
# extracts user_id from the Authorization JWT. The gateway must validate the
# JWT before the function runs; an unauthenticated request must 401.
# Pinned explicitly 2026-05-25 (Option B reconciliation) so a future CLI
# default change cannot silently flip this. Deployed v17 already runs with
# verify_jwt: true; this block documents the intent in source.
[functions.get-library-content]
verify_jwt = true

[functions.weekly-cron-watchdog]
verify_jwt = false

[functions.cleanup-old-cvs]
verify_jwt = false

[functions.sitemap]
verify_jwt = false

[functions.generate-signal-edition]
verify_jwt = false

[functions.subscribe-signal]
verify_jwt = false

[functions.stripe-subscription-webhook]
verify_jwt = false

[functions.payment-webhook]
verify_jwt = false

[functions.manage-unsubscribe]
verify_jwt = false

[functions.send-abandonment-email]
verify_jwt = false

[functions.track-event]
verify_jwt = true

[functions.send-nurture-emails]
verify_jwt = false

[functions.send-funnel-digest]
verify_jwt = false

[functions.generate-content-batch]
verify_jwt = false

# weekly-heartbeat: cron-called via pg_net Mondays 07:50 (Phase D living
# dossier). Same posture as generate-radar; the cron SQL sends the anon
# Bearer anyway so it also works if an MCP redeploy flips this to true.
[functions.weekly-heartbeat]
verify_jwt = false

# admin-regenerate-ai-impact: Move 7 quarterly corpus pass. Gateway JWT on;
# the confirm token + rate limit are the real gate. Invoked manually with
# the anon Bearer each quarter (or by a future quarterly cron).
[functions.admin-regenerate-ai-impact]
verify_jwt = true
