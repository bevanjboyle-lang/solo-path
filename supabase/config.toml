# ──────────────────────────────────────────────────────────────────────────
# verify_jwt policy — full-e2e-review-2026-06-10.
# verify_jwt:false means the gateway does NOT validate the JWT signature, so
# any function that trusts the `sub` claim from an inline base64 decode is
# forgeable. Only the genuinely anonymous funnel entry points may stay false.
# ──────────────────────────────────────────────────────────────────────────

# Anonymous funnel — MUST stay false (called before the user has an account).
[functions.generate-report]
verify_jwt = false

# Authed-only — flipped true 2026-06-10 (was false; forgeable identity).
[functions.generate-guidance]
verify_jwt = true

[functions.ask-solo]
verify_jwt = true

[functions.draft-outreach]
verify_jwt = true

# Destructive / PII — pinned true (live-fixed via Supabase 2026-06-10, P0).
[functions.delete-account]
verify_jwt = true

[functions.export-user-data]
verify_jwt = true

[functions.delete-user-cv]
verify_jwt = true

# get-library-content: verify_jwt explicitly true. The function reads a user-
# specific library (subscription state, completions, unlocked modules) and
# extracts user_id from the Authorization JWT. The gateway must validate the
# JWT before the function runs; an unauthenticated request must 401.
# Pinned explicitly 2026-05-25 (Option B reconciliation) so a future CLI
# default change cannot silently flip this. Deployed v17 already runs with
# verify_jwt: true; this block documents the intent in source.
[functions.get-library-content]
verify_jwt = true
