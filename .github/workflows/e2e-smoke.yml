name: e2e-smoke

# Pre-auth funnel smoke (W3). Runs the anonymous critical path render checks.
# Targets production by default; set PLAYWRIGHT_BASE_URL to a preview URL to
# gate PRs against their own preview deploy.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      # @playwright/test isn't a repo dependency yet; install it at runtime so the
      # smoke runs without anyone needing Node/npm locally. (If it's later added to
      # devDependencies, npm ci will cover it and this line becomes a no-op.)
      - run: npm install --no-save @playwright/test
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          CI: "true"
          # Defaults to production in playwright.config.ts when unset.
          PLAYWRIGHT_BASE_URL: ${{ vars.PLAYWRIGHT_BASE_URL }}
